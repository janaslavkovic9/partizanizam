<div class="profile-wrapper">
  <div class="profile-card" *ngIf="currentUser; else authForms">
    
    <!-- Decorative Banner -->
    <div class="profile-banner"></div>

    <!-- Profile Header & Avatar -->
    <div class="profile-header">
      <div class="avatar-container">
        <img 
          *ngIf="avatarUrl; else initialsAvatar" 
          [src]="avatarUrl" 
          alt="Avatar" 
          class="avatar-img"
        />
        <ng-template #initialsAvatar>
          <div class="avatar-circle">
            {{ username.slice(0, 1).toUpperCase() || 'U' }}
          </div>
        </ng-template>
      </div>

      <div class="user-info" *ngIf="!isEditing">
        <h2>{{ currentUser.username }}</h2>
        <p class="email-text" *ngIf="currentUser.email">{{ currentUser.email }}</p>
        <span class="role-badge">KORISNIK</span>
        <p class="bio-text">{{ bio || 'Nema dodate biografije...' }}</p>
      </div>
    </div>

    <!-- Edit Section -->
    <div class="edit-section" *ngIf="isEditing">
      <div class="form-group">
        <label>Korisničko ime</label>
        <input [(ngModel)]="username" type="text" class="input-field" placeholder="Korisničko ime" />
      </div>

      <div class="form-group">
        <label>Biografija</label>
        <textarea [(ngModel)]="bio" rows="3" class="input-field" placeholder="Napišite nešto o sebi..."></textarea>
      </div>

      <div class="form-group">
        <label>Link do avatarske slike</label>
        <input [(ngModel)]="avatarUrl" type="text" class="input-field" placeholder="https://..." />
      </div>

      <div class="form-actions">
        <button (click)="saveProfile()" class="btn btn-save">Sačuvaj izmene</button>
        <button (click)="toggleEdit()" class="btn btn-cancel">Otkaži</button>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="profile-actions" *ngIf="!isEditing">
      <button (click)="toggleEdit()" class="btn btn-edit">Izmeni profil</button>
      <button (click)="logout()" class="btn btn-logout">Odjavi se</button>
    </div>

  </div>

  <!-- FORMA ZA PRIJAVU / REGISTRACIJU AKO NIJE PRIJAVLJEN -->
  <ng-template #authForms>
    <div class="auth-card">
      <div class="auth-tabs">
        <button [class.active]="isLoginTab" (click)="isLoginTab = true">Prijava</button>
        <button [class.active]="!isLoginTab" (click)="isLoginTab = false">Registracija</button>
      </div>

      <!-- Prijava -->
<form *ngIf="isLoginTab" (ngSubmit)="onLogin()" class="auth-form">
  <h2>Prijavite se</h2>
  <div class="form-group">
    <label>Email</label>
    <input [(ngModel)]="loginEmail" name="loginEmail" type="email" class="input-field" placeholder="Unesite email" required />
  </div>
  <div class="form-group">
    <label>Lozinka</label>
    <input [(ngModel)]="loginPassword" name="loginPassword" type="password" class="input-field" placeholder="Unesite lozinku" required />
  </div>
  <button type="submit" class="btn btn-save">Prijavi se</button>
</form>

      <!-- Registracija -->
      <form *ngIf="!isLoginTab" (ngSubmit)="onRegister()" class="auth-form">
        <h2>Registrujte se</h2>
        <div class="form-group">
          <label>Korisničko ime</label>
          <input [(ngModel)]="regUsername" name="regUsername" type="text" class="input-field" placeholder="Unesite korisničko ime" required />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input [(ngModel)]="regEmail" name="regEmail" type="email" class="input-field" placeholder="Unesite email" required />
        </div>
        <div class="form-group">
          <label>Lozinka</label>
          <input [(ngModel)]="regPassword" name="regPassword" type="password" class="input-field" placeholder="Unesite lozinku" required />
        </div>
        <button type="submit" class="btn btn-save">Registruj se</button>
      </form>
    </div>
  </ng-template>
</div>
