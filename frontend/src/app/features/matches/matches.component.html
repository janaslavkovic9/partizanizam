<div class="matches-container">
  <div class="card schedule-card">
    <div class="card-header-toggle">
      <h3>Zakaži utakmicu</h3>
      <button type="button" class="btn-toggle" (click)="showAddForm = !showAddForm">
        {{ showAddForm ? '−' : '+' }}
      </button>
    </div>

    <div *ngIf="showAddForm" class="form-body">
      <div class="form-group">
        <label>Protivnik</label>
        <input type="text" [(ngModel)]="opponent" placeholder="npr. Real Madrid" class="input-field" />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Datum</label>
          <input type="date" [(ngModel)]="date" class="input-field" />
        </div>

        <div class="form-group">
          <label>Vreme</label>
          <input type="time" [(ngModel)]="time" class="input-field" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Lokacija (Hala)</label>
          <input type="text" [(ngModel)]="location" placeholder="npr. Beogradska Arena" class="input-field" />
        </div>

        <div class="form-group">
          <label>Takmičenje</label>
          <input type="text" [(ngModel)]="competition" placeholder="npr. Evroliga" class="input-field" />
        </div>
      </div>

      <div class="form-group">
        <label>Kafić / Mesto gledanja utakmice</label>
        <input type="text" [(ngModel)]="cafeName" placeholder="Npr. Pivnica Partizanizam" class="input-field" />
      </div>

      <div class="map-picker-row">
        <button type="button" class="btn-map" (click)="openMapModal()">
          📍 {{ selectedLat ? 'Lokacija izabrana na mapi' : 'Izaberi lokaciju kafića na mapi' }}
        </button>
      </div>

      <div class="form-group checkbox-group">
        <label>
          <input type="checkbox" [(ngModel)]="isHome" />
          Domaći teren
        </label>
      </div>

      <p class="error-text" *ngIf="errorMessage">
        {{ errorMessage }}
      </p>

      <button type="button" class="btn-submit" (click)="scheduleMatch()">Zakaži</button>
    </div>
  </div>

  <div class="calendar-card">
    <div class="calendar-header">
      <button type="button" class="btn-nav" (click)="changeMonth(-1)">‹</button>
      <h4>{{ currentDisplayDate | date:'LLLL yyyy.' }}</h4>
      <button type="button" class="btn-nav" (click)="changeMonth(1)">›</button>
    </div>

    <div class="calendar-grid weekday-grid">
      <div *ngFor="let dayName of weekDays" class="weekday-header">{{ dayName }}</div>
    </div>

    <div class="calendar-grid">
      <div 
        *ngFor="let day of calendarDays" 
        class="calendar-day"
        [class.has-match]="day.matches.length > 0"
        (click)="selectDay(day)"
      >
        <div class="day-number">{{ day.date.getDate() }}</div>
        
        <div *ngIf="day.matches.length > 0" class="match-list-preview">
          <div *ngFor="let m of day.matches" class="match-item">
            <span class="match-badge">🏀 vs {{ m.opponent }}</span>
            <a 
              [routerLink]="['/map']" 
              [queryParams]="{ matchId: m.id }" 
              class="map-link-btn"
              (click)="$event.stopPropagation()"
            >
              📍 Gde gledati?
            </a>
            <button type="button" class="btn-delete-small" (click)="deleteMatch(m.id); $event.stopPropagation()">🗑️</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-backdrop" *ngIf="showMapModal">
  <div class="modal-content">
    <h4>Kliknite na mapu da izaberete kafić</h4>
    <div id="picker-map"></div>

    <div class="modal-footer">
      <button type="button" class="btn-cancel" (click)="closeMapModal()">Otkaži</button>
      <button type="button" class="btn-confirm" (click)="confirmLocation()" [disabled]="!selectedLat">Potvrdi lokaciju</button>
    </div>
  </div>
</div>
