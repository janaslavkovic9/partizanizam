<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <h2>{{ isLoginMode ? 'Prijava' : 'Registracija' }}</h2>
      <p>{{ isLoginMode ? 'Dobrodošli nazad na Partizanizam' : 'Kreirajte vaš nalog' }}</p>
    </div>

    @if (errorMessage) {
      <div class="error-banner">
        {{ errorMessage }}
      </div>
    }

    <form (submit)="$event.preventDefault(); onSubmit()">
      @if (!isLoginMode) {
        <div class="form-group">
          <label>Korisničko ime</label>
          <input 
            type="text" 
            [(ngModel)]="username" 
            name="username" 
            placeholder="Unesite korisničko ime" />
        </div>
      }

      <div class="form-group">
        <label>Email adresa</label>
        <input 
          type="email" 
          [(ngModel)]="email" 
          name="email" 
          placeholder="Unesite email" />
      </div>

      <div class="form-group">
        <label>Lozinka</label>
        <input 
          type="password" 
          [(ngModel)]="password" 
          name="password" 
          placeholder="Unesite lozinku" />
      </div>

      <button type="button" (click)="onSubmit()" class="btn-submit">
        {{ isLoginMode ? 'Prijavi se' : 'Registruj se' }}
      </button>
    </form>

    <div class="auth-footer">
      <span>{{ isLoginMode ? 'Nemate nalog?' : 'Već imate nalog?' }}</span>
      <button type="button" class="btn-toggle" (click)="toggleMode()">
        {{ isLoginMode ? 'Registrujte se' : 'Prijavite se' }}
      </button>
    </div>
  </div>
</div>
