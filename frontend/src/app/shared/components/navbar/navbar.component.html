<nav class="navbar">
  <div class="nav-container">
    <a routerLink="/" class="nav-brand">
      <span class="brand-text">Partizanizam</span>
    </a>

    <div class="nav-links">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
        Početna
      </a>

      @if (currentUser) {
        <a routerLink="/profile" routerLinkActive="active" class="profile-link">
          <div class="avatar-pill">
            <span class="avatar-char">{{ getAvatarInitial() }}</span>
            <span class="username">{{ currentUser.username }}</span>
          </div>
        </a>

        <button class="btn-logout-nav" (click)="onLogout()" title="Odjavi se">
          Odjava
        </button>
      } @else {
        <a routerLink="/auth" routerLinkActive="active" class="btn-login-nav">
          Prijava
        </a>
      }
    </div>
  </div>
</nav>
