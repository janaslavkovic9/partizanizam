<nav class="navbar">
  <div class="nav-container">
    <a routerLink="/" class="nav-logo">
      <span>Partizanizam</span>
    </a>

    <div class="nav-links">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Početna</a>
      
      @if (authService.currentUser$ | async; as user) {
        <a routerLink="/profile" routerLinkActive="active" class="profile-link">
          <span class="user-avatar">{{ user.username.charAt(0).toUpperCase() }}</span>
          <span>{{ user.username }}</span>
        </a>
      } @else {
        <a routerLink="/auth" routerLinkActive="active" class="login-btn">Prijava</a>
      }
    </div>
  </div>
</nav>
